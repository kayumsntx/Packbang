<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>Press 'N' to toggle Dark Mode</h1>
    <textarea
      id="typewriter"
      placeholder="Start typing to hear the keys..."
    ></textarea>
    <script>
      document.addEventListener("keydown", function (event) {
        // event.key tells us exactly which character was pressed
        if (event.key.toLowerCase() === "n") {
          document.body.classList.toggle("dark-theme");
        }
      });
    </script>

    <style>
      .dark-theme {
        background: #222;
        color: #fff;
      }
      body {
        transition: background 0.5s;
        font-family: sans-serif;
      }
    </style>
  </body>
</html>
